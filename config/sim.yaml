# Every topic, frame, joint, controller and limit the pipeline uses. Sim and real robot differ
# ONLY here (config/sim.yaml vs config/real.yaml), never in code. Names below were verified in
# Gazebo with scripts/probe_interface.py (docs/interface_sim.md).

use_sim_time: true

robot:
  id: tiago-pro-30-gazebo
  # Frame of every recorded pose and camera extrinsic (RoboTwin's "world"). The base is fixed
  # during collection, so base_footprint is a stable world frame.
  world_frame: base_footprint
  joint_states_topic: /joint_states
  robot_description_topic: /robot_description

arms:
  left:
    joints: [arm_left_1_joint, arm_left_2_joint, arm_left_3_joint, arm_left_4_joint,
             arm_left_5_joint, arm_left_6_joint, arm_left_7_joint]
    controller_topic: /arm_left_controller/joint_trajectory
    tcp_frame: gripper_left_grasping_link
    gripper:
      joint: gripper_left_finger_joint
      controller_topic: /gripper_left_controller/joint_trajectory
      # Finger joint position for normalized gripper 1 (open) and 0 (closed), RoboTwin convention.
      open_position: 0.07
      closed_position: 0.0
      # Pad-to-pad jaw opening (m) at normalized 0 and 1 (measured in Gazebo: fingertip origins are 28 mm
      # apart closed, 83 mm open). Places the per-finger points in extract_gripper_contacts.py.
      jaw_opening: [0.0, 0.055]
  right:
    joints: [arm_right_1_joint, arm_right_2_joint, arm_right_3_joint, arm_right_4_joint,
             arm_right_5_joint, arm_right_6_joint, arm_right_7_joint]
    controller_topic: /arm_right_controller/joint_trajectory
    tcp_frame: gripper_right_grasping_link
    gripper:
      joint: gripper_right_finger_joint
      controller_topic: /gripper_right_controller/joint_trajectory
      open_position: 0.07
      closed_position: 0.0
      # Pad-to-pad jaw opening (m) at normalized 0 and 1 (measured in Gazebo: fingertip origins are 28 mm
      # apart closed, 83 mm open). Places the per-finger points in extract_gripper_contacts.py.
      jaw_opening: [0.0, 0.055]

# Keys are the RoboTwin observation names CoDex reads (head_camera, left_camera, right_camera).
cameras:
  head_camera:
    image_topic: /head_front_camera/color/image_raw
    info_topic: /head_front_camera/color/camera_info
  left_camera:
    image_topic: /gripper_left_camera/color/image_raw
    info_topic: /gripper_left_camera/color/camera_info
  right_camera:
    image_topic: /gripper_right_camera/color/image_raw
    info_topic: /gripper_right_camera/color/camera_info

# Joints that stay fixed during collection (PAL: arms shake when base/torso move).
# The `ready` event drives them here; teleop never moves them otherwise.
fixed_joints:
  torso:
    controller_topic: /torso_controller/joint_trajectory
    positions: {torso_lift_joint: 0.10}
  head:
    controller_topic: /head_controller/joint_trajectory
    positions: {head_1_joint: 0.0, head_2_joint: -0.55}

# Arm configuration teleop starts from (Y button or the `ready` event): TCPs 0.5 m ahead,
# 0.22 m to each side, 0.19 m above the table, approach axis pitched 60 deg down, wrist camera on
# top of the gripper (upright wrist images). Found by IK with torso 0.10 m, >= 0.57 rad from
# every joint limit; the right arm mirrors the left (joints 1, 3, 5, 7 negated).
ready_pose:
  left: [2.23, -1.51, -1.86, -1.87, -2.22, 1.98, -0.93]
  right: [-2.23, -1.51, 1.86, -1.87, 2.22, 1.98, 0.93]
  duration_s: 4.0

teleop:
  # Real robot: keep false until a supervised first-motion test (PLAN.md hard rule 1).
  enable_motion: true
  # Sim only: drive to the ready pose as soon as teleop starts (also triggers the scene spawn).
  ready_on_start: true
  rate_hz: 50
  # Seconds ahead of now that each single-point joint trajectory is due. Larger is smoother but
  # laggier; must exceed 1/rate_hz.
  command_horizon_s: 0.1
  # Controller-to-robot translation scale (1.0 = same distance).
  translation_scale: 1.0
  max_linear_speed: 0.35      # m/s of the commanded TCP target
  max_angular_speed: 1.5      # rad/s of the commanded TCP target
  max_joint_speed: 1.5        # rad/s per arm joint in the IK output
  joint_limit_margin: 0.05    # rad kept away from URDF limits
  ik_damping: 0.05
  ik_iterations: 8
  # TCP workspace box in world_frame (m). Targets are clipped into it.
  workspace:
    x: [0.20, 0.95]
    y: [-0.65, 0.65]
    z: [0.83, 1.50]
  # Quest operator frame -> robot: the operator faces the robot's +x. WebXR local-floor axes are
  # x right, y up, z toward the operator; rows map them to world x (forward), y (left), z (up).
  quest_to_world: [[0, 0, -1], [-1, 0, 0], [0, 1, 0]]
  # A pose packet older than this releases the clutch (Quest tracking or network loss).
  input_timeout_s: 0.3
  gripper_rate: 2.0           # normalized gripper units per second

quest:
  http_port: 8080             # serves the WebXR page + WebSocket on 127.0.0.1
  view_fps: 15                # camera mosaic streamed to the headset
  view_tile: [480, 360]       # per-camera tile in the headset mosaic
  view_cameras: [head_camera, left_camera, right_camera]

recorder:
  rate_hz: 15
  # A step is dropped (with a warning) if any stream's newest message is older than this.
  max_staleness_s: 0.1
  jpeg_quality: 90
  # Output: <data_root>/<task_name>/<collection>/{data,instructions,meta}/episode{N}.*
  # (the RoboTwin layout CoDex's prepare_dataset.py reads with --raw-root <...>/<collection>).
  data_root: /home/user/tiago_ws/data
  collection: tiago_gazebo_teleop
  task_name: place_cube_can_tray
  instruction: Place the cube and the can onto the tray

# Gazebo only (scene_node). Spawned after the first ready motion; `reset_scene` re-randomizes the
# objects. x/y/yaw are uniform ranges in the world frame; z is the drop height.
sim_scene:
  seed: null
  table: {model: table_0m8, pose: [0.85, 0.0, 0.0, 0.0]}   # x y z yaw; top at z = 0.815
  objects:
    # Own models: PAL's green_cube (60 mm) and coke_can_slim (58 mm) exceed the gripper's ~55 mm opening.
    cube: {model: tiago_dc_cube, x: [0.48, 0.58], y: [0.16, 0.30], z: 0.84, yaw: [-0.6, 0.6]}
    can: {model: tiago_dc_can, x: [0.48, 0.58], y: [-0.30, -0.16], z: 0.87, yaw: [0.0, 0.0]}
    tray: {model: tiago_dc_tray, x: [0.60, 0.66], y: [-0.04, 0.04], z: 0.825, yaw: [-0.15, 0.15]}
